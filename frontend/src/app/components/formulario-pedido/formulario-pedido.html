<div class="container my-4">
  <div class="card-pizzeria p-4 mb-4 border-top border-danger border-5">
    <h3 class="titulo-seccion text-center">🍕 Sistema de Pedidos - Pizzería </h3>
    
    <form [formGroup]="pedidoForm">
      
      <!-- Datos del Cliente -->
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label fw-bold text-secondary">Nombre del Cliente:</label>
          <input type="text" class="form-control" formControlName="nombre" placeholder="Ej. Braulio Bernal" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold text-secondary">Dirección:</label>
          <input type="text" class="form-control" formControlName="direccion" placeholder="Ej. Blvd. 5 de Mayo" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold text-secondary">Teléfono:</label>
          <input type="text" class="form-control" formControlName="telefono" placeholder="Ej. 477-787-23" />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold text-secondary">Fecha del Pedido:</label>
          <input type="date" class="form-control" formControlName="fecha" />
        </div>
      </div>

      <!-- Selección de Pizza e Ingredientes -->
      <div class="row g-3 align-items-stretch">
        
        <!-- Tamaño -->
        <div class="col-md-4">
          <div class="p-3 border rounded bg-light h-100">
            <p class="fw-bold text-danger mb-2">🏷️ Tamaño de Pizza</p>
            <div class="form-check">
              <input class="form-check-input" type="radio" formControlName="tamano" value="Chica" id="tamChica" />
              <label class="form-check-label" for="tamChica">Chica — <strong>$40</strong></label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" formControlName="tamano" value="Mediana" id="tamMediana" />
              <label class="form-check-label" for="tamMediana">Mediana — <strong>$80</strong></label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" formControlName="tamano" value="Grande" id="tamGrande" />
              <label class="form-check-label" for="tamGrande">Grande — <strong>$120</strong></label>
            </div>
          </div>
        </div>

        <!-- Ingredientes -->
        <div class="col-md-4">
          <div class="p-3 border rounded bg-light h-100">
            <p class="fw-bold text-danger mb-2">🧀 Ingredientes Extra ($10 c/u)</p>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="jamon" id="ingJamon" />
              <label class="form-check-label" for="ingJamon">Jamón</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="pina" id="ingPina" />
              <label class="form-check-label" for="ingPina">Piña</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" formControlName="champinones" id="ingChamp" />
              <label class="form-check-label" for="ingChamp">Champiñones</label>
            </div>
          </div>
        </div>

        <!-- Cantidad y Botón -->
        <div class="col-md-4 d-flex flex-column justify-content-center align-items-center">
          <div class="mb-3 w-75 text-center">
            <label class="form-label fw-bold text-secondary">Cantidad:</label>
            <input type="number" class="form-control text-center fw-bold fs-5" formControlName="num_pizzas" min="1" />
          </div>
          <button type="button" class="btn btn-pizzeria w-75 py-2 shadow-sm" (click)="agregarPizza()">
            ➕ Agregar al Pedido
          </button>
        </div>

      </div>
    </form>
  </div>
</div>
